name: Build FH2 iOS Recompiled

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Generate Custom CMakeLists.txt and Fallback Source
        run: |
          mkdir -p src
          FOUND_FILES=$(find . -name "*.cpp" -o -name "*.cc" -o -name "*.c" -o -name "*.m" -o -name "*.mm" | grep -v "/build/" | grep -v "/CMakeFiles/" || true)
          
          if [ -z "$FOUND_FILES" ]; then
            echo "No source files detected. Creating fallback iOS entry point..."
            echo '#import <UIKit/UIKit.h>' > src/main.mm
            echo '#import <MetalKit/MetalKit.h>' >> src/main.mm
            echo '@interface AppDelegate : UIResponder <UIApplicationDelegate>' >> src/main.mm
            echo '@property (strong, nonatomic) UIWindow *window;' >> src/main.mm
            echo '@end' >> src/main.mm
            echo '@implementation AppDelegate' >> src/main.mm
            echo '- (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {' >> src/main.mm
            echo '    self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];' >> src/main.mm
            echo '    UIViewController *vc = [[UIViewController alloc] init];' >> src/main.mm
            echo '    vc.view.backgroundColor = [UIColor blackColor];' >> src/main.mm
            echo '    self.window.rootViewController = vc;' >> src/main.mm
            echo '    [self.window makeKeyAndVisible];' >> src/main.mm
            echo '    return YES;' >> src/main.mm
            echo '}' >> src/main.mm
            echo '@end' >> src/main.mm
            echo 'int main(int argc, char * argv[]) {' >> src/main.mm
            echo '    @autoreleasepool {' >> src/main.mm
            echo '        return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));' >> src/main.mm
            echo '    }' >> src/main.mm
            echo '}' >> src/main.mm
          fi

          echo "cmake_minimum_required(VERSION 3.20)" > CMakeLists.txt
          echo "project(FH2_Recompiled LANGUAGES C CXX OBJC OBJCXX)" >> CMakeLists.txt
          echo "set(CMAKE_CXX_STANDARD 17)" >> CMakeLists.txt
          echo "set(CMAKE_CXX_STANDARD_REQUIRED ON)" >> CMakeLists.txt
          echo "file(GLOB_RECURSE ALL_FILES \"*.cpp\" \"*.cc\" \"*.c\" \"*.m\" \"*.mm\")" >> CMakeLists.txt
          echo "set(SOURCES \"\")" >> CMakeLists.txt
          echo "foreach(FILE \${ALL_FILES})" >> CMakeLists.txt
          echo "    if(NOT FILE MATCHES \"/build/\" AND NOT FILE MATCHES \"/CMakeFiles/\" AND NOT FILE MATCHES \"/\\\\.\")" >> CMakeLists.txt
          echo "        list(APPEND SOURCES \${FILE})" >> CMakeLists.txt
          echo "    endif()" >> CMakeLists.txt
          echo "endforeach()" >> CMakeLists.txt
          echo "message(STATUS \"Final Sources: \${SOURCES}\")" >> CMakeLists.txt
          echo "add_executable(FH2App \${SOURCES})" >> CMakeLists.txt
          echo "target_link_libraries(FH2App PRIVATE \"-framework Foundation\" \"-framework UIKit\" \"-framework Metal\" \"-framework MetalKit\" \"-framework QuartzCore\" \"-framework AudioToolbox\")" >> CMakeLists.txt
          echo "set_target_properties(FH2App PROPERTIES MACOSX_BUNDLE TRUE MACOSX_BUNDLE_GUI_IDENTIFIER \"com.recompiled.fh2\" MACOSX_BUNDLE_BUNDLE_NAME \"FH2 Recompiled\")" >> CMakeLists.txt

      - name: Configure CMake for iOS
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64"

      - name: Build Xcode Project
        run: |
          xcodebuild -project build/FH2_Recompiled.xcodeproj \
            -scheme FH2App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Unsigned .ipa
        run: |
          mkdir -p Payload
          # সুনির্দিষ্টভাবে বিল্ড ফোল্ডার থেকে .app বান্ডল ট্র্যাক করার উন্নত পদ্ধতি
          APP_PATH=$(find build -name "FH2App.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi

          if [ -n "$APP_PATH" ]; then
            echo "Found .app at: $APP_PATH"
            cp -r "$APP_PATH" Payload/
            zip -r FH2_Recompiled_iOS.ipa Payload
            rm -rf Payload
            echo "Successfully created FH2_Recompiled_iOS.ipa"
          else
            echo "Error: .app bundle not found anywhere in workspace!"
            find . -maxdepth 3
            exit 1
          fi

      - name: Upload Artifacts (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: FH2-iOS-Unsigned-IPA
          path: FH2_Recompiled_iOS.ipa
          retention-days: 7
