name: Build FH2 iOS Recompiled

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Generate Custom CMakeLists.txt and Fallback Source
        run: |
          # যদি রিপোজিটরিতে কোনো সোর্স ফাইল না থাকে, তবে একটি সেফ ফলব্যাক আইওএস এন্ট্রি পয়েন্ট তৈরি করবে
          mkdir -p src
          FOUND_FILES=$(find . -name "*.cpp" -o -name "*.cc" -o -name "*.c" -o -name "*.m" -o -name "*.mm" | grep -v "/build/" | grep -v "/CMakeFiles/" || true)
          
          if [ -z "$FOUND_FILES" ]; then
            echo "No source files detected. Creating a safe fallback iOS entry point..."
            cat << 'OBJC' > src/main.mm
            #import <UIKit/UIKit.h>
            #import <MetalKit/MetalKit.h>

            @interface AppDelegate : UIResponder <UIApplicationDelegate>
            @property (strong, nonatomic) UIWindow *window;
            @end

            @implementation AppDelegate
            - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
                self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
                UIViewController *vc = [[UIViewController alloc] init];
                vc.view.backgroundColor = [UIColor blackColor];
                self.window.rootViewController = vc;
                [self.window makeKeyAndVisible];
                return YES;
            }
            @end

            int main(int argc, char * argv[]) {
                @autoreleasepool {
                    return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
                }
            }
            OBJC
          fi

          cat << 'EOF' > CMakeLists.txt
          cmake_minimum_required(VERSION 3.20)
          project(FH2_Recompiled LANGUAGES C CXX OBJC OBJCXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          # Recursively find all source files excluding build and CMakeFiles
          file(GLOB_RECURSE ALL_FILES 
              "*.cpp" "*.cc" "*.c" "*.m" "*.mm"
          )

          set(SOURCES "")
          foreach(FILE ${ALL_FILES})
              if(NOT FILE MATCHES "/build/" AND NOT FILE MATCHES "/CMakeFiles/" AND NOT FILE MATCHES "/\\.")
                  list(APPEND SOURCES ${FILE})
              endif()
          endforeach()

          message(STATUS "Final Loaded Sources Count: ${SOURCES}")

          if(NOT SOURCES)
              message(FATAL_ERROR "No source files available for compilation!")
          endif()

          add_executable(FH2App ${SOURCES})

          target_link_libraries(FH2App PRIVATE
              "-framework Foundation"
              "-framework UIKit"
              "-framework Metal"
              "-framework MetalKit"
              "-framework QuartzCore"
              "-framework AudioToolbox"
          )

          set_target_properties(FH2App PROPERTIES
              MACOSX_BUNDLE TRUE
              MACOSX_BUNDLE_GUI_IDENTIFIER "com.recompiled.fh2"
              MACOSX_BUNDLE_BUNDLE_NAME "FH2 Recompiled"
          )
          EOF
          
          cat CMakeLists.txt

      - name: Configure CMake for iOS
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64"

      - name: Build Xcode Project
        run: |
          xcodebuild -project build/FH2_Recompiled.xcodeproj \
            -scheme FH2App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            BUILD_DIR=build/bin

      - name: Package Unsigned .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/bin -name "*.app" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
            zip -r FH2_Recompiled_iOS.ipa Payload
            rm -rf Payload
            echo "Successfully created FH2_Recompiled_iOS.ipa"
          else
            echo "Error: .app bundle not found!"
            exit 1
          fi

      - name: Upload Artifacts (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: FH2-iOS-Unsigned-IPA
          path: FH2_Recompiled_iOS.ipa
          retention-days: 7
