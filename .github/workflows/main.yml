name: Build FH2 iOS Recompiled

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Setup Python & SDK Dependencies
        run: |
          python3 --version
          # প্রজেক্টের থার্ড-পার্টি টুলস ও SDK ফেচ করার কমান্ড
          if [ -f "tools/fetch_thirdparty.py" ]; then
            python3 tools/fetch_thirdparty.py || true
          fi

      - name: Generate Custom CMakeLists.txt and Structure for iOS
        run: |
          cat << 'EOF' > CMakeLists.txt
          cmake_minimum_required(VERSION 3.20)
          project(FH2_Recompiled LANGUAGES C CXX OBJC OBJCXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          # জেনারেটেড কোড ফোল্ডার এবং সোর্স ফাইলগুলোর সঠিক পাথ সিকিউর করা
          set(SOURCES "")
          
          if(EXISTS "${CMAKE_CURRENT_SOURCE_DIR}/app/generated")
              file(GLOB_RECURSE GEN_SRCS "app/generated/*.cpp" "app/generated/*.cc" "app/generated/*.c")
              list(APPEND SOURCES ${GEN_SRCS})
          endif()

          if(EXISTS "${CMAKE_CURRENT_SOURCE_DIR}/src")
              file(GLOB_RECURSE SRC_SRCS "src/*.cpp" "src/*.cc" "src/*.c" "src/*.m" "src/*.mm")
              list(APPEND SOURCES ${SRC_SRCS})
          endif()

          # যদি কোনো কারণে ফোল্ডার খালি থাকে তবে ফলব্যাক সেফটি
          if(NOT SOURCES)
              file(GLOB_RECURSE ALL_FILES "*.cpp" "*.cc" "*.c")
              foreach(FILE ${ALL_FILES})
                  if(NOT FILE MATCHES "/build/" AND NOT FILE MATCHES "/CMakeFiles/")
                      list(APPEND SOURCES ${FILE})
                  endif()
              endforeach()
          endif()

          message(STATUS "Final Loaded Sources Count: ${SOURCES}")

          if(NOT SOURCES)
              message(FATAL_ERROR "No source files available for compilation!")
          endif()

          add_executable(FH2App ${SOURCES})

          target_link_libraries(FH2App PRIVATE
              "-framework Foundation"
              "-framework UIKit"
              "-framework Metal"
              "-framework MetalKit"
              "-framework QuartzCore"
              "-framework AudioToolbox"
          )

          set_target_properties(FH2App PROPERTIES
              MACOSX_BUNDLE TRUE
              MACOSX_BUNDLE_GUI_IDENTIFIER "com.recompiled.fh2"
              MACOSX_BUNDLE_BUNDLE_NAME "FH2 Recompiled"
          )
          EOF
          
          cat CMakeLists.txt

      - name: Configure CMake for iOS
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64"

      - name: Build Xcode Project
        run: |
          xcodebuild -project build/FH2_Recompiled.xcodeproj \
            -scheme FH2App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            BUILD_DIR=build/bin

      - name: Package Unsigned .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/bin -name "*.app" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
            zip -r FH2_Recompiled_iOS.ipa Payload
            rm -rf Payload
            echo "Successfully created FH2_Recompiled_iOS.ipa"
          else
            echo "Error: .app bundle not found!"
            exit 1
          fi

      - name: Upload Artifacts (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: FH2-iOS-Unsigned-IPA
          path: FH2_Recompiled_iOS.ipa
          retention-days: 7
