name: Build FH2 iOS Recompiled

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14 # Apple Silicon M1/M2 macOS Runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Generate Custom CMakeLists.txt for iOS Target
        run: |
          cat << 'EOF' > CMakeLists.txt
          cmake_minimum_required(VERSION 3.20)
          project(FH2_Recompiled LANGUAGES C CXX OBJC OBJCXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          # Scan only the src directory or specific folders to avoid CMake test junk
          file(GLOB_RECURSE SOURCES 
              "src/*.cpp" "src/*.cc" "src/*.c" "src/*.m" "src/*.mm"
              "source/*.cpp" "source/*.cc" "source/*.c" "source/*.m" "source/*.mm"
          )

          # Fallback if src/ doesn't exist: search all except build and CMakeFiles
          if(NOT SOURCES)
              file(GLOB_RECURSE ALL_FILES "*.cpp" "*.cc" "*.c")
              foreach(FILE ${ALL_FILES})
                  if(NOT FILE MATCHES "build" AND NOT FILE MATCHES "CMakeFiles")
                      list(APPEND SOURCES ${FILE})
                  endif()
              endforeach()
          endif()

          message(STATUS "Cleaned Source Files: ${SOURCES}")

          if(NOT SOURCES)
              message(FATAL_ERROR "No valid source files found!")
          endif()

          add_executable(FH2App ${SOURCES})

          # Link necessary iOS Frameworks
          target_link_libraries(FH2App PRIVATE
              "-framework Foundation"
              "-framework UIKit"
              "-framework Metal"
              "-framework MetalKit"
              "-framework QuartzCore"
              "-framework AudioToolbox"
          )

          set_target_properties(FH2App PROPERTIES
              MACOSX_BUNDLE TRUE
              MACOSX_BUNDLE_GUI_IDENTIFIER "com.recompiled.fh2"
              MACOSX_BUNDLE_BUNDLE_NAME "FH2 Recompiled"
          )
          EOF
          
          cat CMakeLists.txt

      - name: Configure CMake for iOS
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64"

      - name: Build Xcode Project
        run: |
          xcodebuild -project build/FH2_Recompiled.xcodeproj \
            -scheme FH2App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            BUILD_DIR=build/bin

      - name: Package Unsigned .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/bin -name "*.app" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
            zip -r FH2_Recompiled_iOS.ipa Payload
            rm -rf Payload
            echo "Successfully created FH2_Recompiled_iOS.ipa"
          else
            echo "Error: .app bundle not found!"
            exit 1
          fi

      - name: Upload Artifacts (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: FH2-iOS-Unsigned-IPA
          path: FH2_Recompiled_iOS.ipa
          retention-days: 7
